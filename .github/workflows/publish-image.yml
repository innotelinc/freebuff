# Builds, smoke-tests, and publishes the Onyx CLI image to GHCR.
#
# Images:
#   ghcr.io/innotelinc/onyx:latest   — default branch
#   ghcr.io/innotelinc/onyx:<sha>    — every build
#   ghcr.io/innotelinc/onyx:v1.2.3   — tags starting with v
#
# The push to GHCR only happens after the smoke job proves the image works:
# a real OmniRoute gateway stack is started and the entrypoint's headless
# smoke mode (ONYX_SMOKE=1) must complete a chat-completion round-trip
# through the gateway before the image is published.
#
# The gateway (OmniRoute) is pulled separately at `docker compose up` time;
# this image is only the Onyx client wired to it.

name: Publish Onyx image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The package name on GHCR (must match compose/README — the repo is named
  # `freebuff`, but the published image is `onyx`).
  IMAGE_NAME: innotelinc/onyx

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Smoke test against a live gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Onyx image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/innotelinc/onyx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the image for local compose use
        run: docker tag ghcr.io/innotelinc/onyx:ci ghcr.io/innotelinc/onyx:latest

      - name: Start the gateway stack (OmniRoute + Redis)
        run: docker compose up -d omniroute

      - name: Smoke test the image (headless round-trip through the gateway)
        run: |
          docker compose run --rm -T -e ONYX_SMOKE=1 onyx > smoke.log 2>&1 \
            || { cat smoke.log; exit 1; }
          cat smoke.log
          grep -q "onyx smoke ok" smoke.log

      - name: Tear down the stack
        if: always()
        run: docker compose down --remove-orphans

  push:
    name: Push to GHCR
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
